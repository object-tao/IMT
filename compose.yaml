services:
  app:
    image: ${IMT_IMAGE:-ghcr.io/object-tao/imt:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IMT_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in your untracked .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your untracked .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_FILE: /app/data/imt.sqlite
      AMAP_TRUCK_KEY: ${AMAP_TRUCK_KEY:-}
      HERE_ROUTING_KEY: ${HERE_ROUTING_KEY:-}
      ROAD_CACHE_TTL_SECONDS: ${ROAD_CACHE_TTL_SECONDS:-0}
    volumes:
      - imt-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  imt-data:
